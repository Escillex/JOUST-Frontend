# ── Frontend, PROD mode ──────────────────────────────────────────────────────
# Built standalone image; the Dockerfile CMD runs the bundled server.js, which
# honours PORT/HOSTNAME env (set in the image to 3000 / 0.0.0.0). No mounts.
services:
  new:
    build:
      # Absolute var (set in .env by setup.sh) → folder-name-agnostic; dockerfile
      # is resolved relative to this context, i.e. <repo>/deploy/Dockerfile.prod.
      context: ${JOUST_FRONTEND_DIR:-./new}
      dockerfile: deploy/Dockerfile.prod
    expose:
      - "3000"
