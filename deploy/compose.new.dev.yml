# ── Frontend, DEV mode ───────────────────────────────────────────────────────
# Mounted source + hot reload via the existing dev Dockerfile.
services:
  new:
    build:
      # Absolute var (set in .env by setup.sh) → folder-name-agnostic
      # (JOUST-Frontend, new, …); the fragment lives inside the frontend repo.
      context: ${JOUST_FRONTEND_DIR:-./new}
      dockerfile: Dockerfile
    command: npm run dev -- -H 0.0.0.0 -p 3000
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Named hosts trusted for HMR / Server Actions (LAN IP, tunnel host, …).
      - EXTRA_DEV_ORIGINS=${EXTRA_DEV_ORIGINS:-}
    volumes:
      - ${JOUST_FRONTEND_DIR:-./new}:/app
      - /app/node_modules
      - /app/.next
    expose:
      - "3000"
